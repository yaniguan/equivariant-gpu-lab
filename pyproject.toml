[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "equivariant-gpu-lab"
version = "0.1.0"
description = "O(3)-equivariant GPU roofline analysis, Morton graph locality, FP8 spherical scaling, and conservative PBC virial utilities."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["equivariant_gpu_lab*"]
